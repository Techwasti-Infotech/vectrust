[package]
name = "vectrust"
version = "0.1.0"
edition = "2021"
authors = ["Vectrust Contributors"]
description = "A high-performance, embedded vector database engine written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/techwastiinfotech/vectrust"
homepage = "https://techwastiinfotech.github.io/vectrust"
documentation = "https://techwastiinfotech.github.io/vectrust"
keywords = ["vector-database", "hnsw", "ann", "embeddings", "embedded-database"]
categories = ["database-implementations", "data-structures", "algorithms"]

[[bin]]
name = "vectrust"
path = "src/bin/vectrust.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"
rayon = "1.10"
parking_lot = "0.12"
rand = "0.8"
crc32fast = "1.4"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
